<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlightRadar · MeowTileKit</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="hud">
      <header class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" />
          </svg>
        </span>
        <span class="brand-text">
          <h1>FlightRadar</h1>
          <span class="brand-sub">实时航班追踪</span>
        </span>
        <button id="settings-btn" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>
    </div>

    <!-- 跟随标注：引线 + 信息框（支持多个） -->
    <svg id="callout-svg"></svg>
    <div id="callout"></div>

    <!-- 底部居中搜索 -->
    <div id="search">
      <input id="airport-search" placeholder="搜索机场 (PEK / ZBAA / Beijing)" autocomplete="off" />
      <div id="search-results" class="hidden"></div>
    </div>

    <!-- 底部：机场面板（标题栏 + 航班板 + 机场信息） -->
    <div id="airport-dock" class="airport-dock hidden">
      <div class="ad-head">
        <span class="ad-grip" title="拖动">⠿</span>
        <span class="ad-title" id="ad-title">—</span>
        <span class="ad-sub" id="ad-sub"></span>
        <span class="ad-actions">
          <button id="fb-collapse" class="ad-btn" type="button" title="折叠">
            <svg class="fb-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <button id="fb-reset" class="ad-btn" type="button" title="恢复默认布局">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></svg>
          </button>
          <button id="fb-close" class="ad-close" type="button" title="关闭">✕</button>
        </span>
      </div>
      <div class="ad-body">
        <div class="flight-board">
          <div id="fb-body" class="fb-body"></div>
        </div>
      </div>
    </div>

    <!-- 右下：图例 + 飞机计数 -->
    <div id="legend">
      <button id="legend-header" type="button" aria-expanded="true">
        <span>图例</span>
        <svg class="legend-caret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
      <div class="legend-body">
        <div class="legend-group">
          <button type="button" class="legend-item" data-cat="b30"><i style="background:#5aa9ff"></i>&gt;30000ft</button>
          <button type="button" class="legend-item" data-cat="b20"><i style="background:#41c7ff"></i>20000–30000ft</button>
          <button type="button" class="legend-item" data-cat="b10"><i style="background:#63e07a"></i>10000–20000ft</button>
          <button type="button" class="legend-item" data-cat="b3"><i style="background:#ffe066"></i>3000–10000ft</button>
          <button type="button" class="legend-item" data-cat="b0"><i style="background:#ff9e2c"></i>&lt;3000ft</button>
          <button type="button" class="legend-item" data-cat="noalt"><i style="background:#ffffff"></i>未报高度</button>
          <button type="button" class="legend-item" data-cat="ground"><i style="background:#c084fc"></i>地面</button>
        </div>
        <div class="legend-group">
          <span class="legend-item"><i style="background:#ff5d8f"></i>跑道</span>
          <span class="legend-item"><i style="background:#4fc3f7"></i>机场</span>
          <span class="legend-item"><i style="background:#c792ea"></i>VOR/DME</span>
          <span class="legend-item"><i style="background:#f0a020"></i>NDB</span>
        </div>
      </div>
      <div class="legend-status"><span id="status" class="status">连接中…</span></div>
    </div>

    <!-- 设置模态框 -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <div class="modal-head">
          <span>设置</span>
          <button id="settings-close" type="button" aria-label="关闭">✕</button>
        </div>
        <div class="title">数据源</div>
        <select id="provider-select"></select>
        <div id="provider-note" class="status"></div>
        <div class="title" style="margin-top:10px">底图</div>
        <select id="source-select" title="底图">
          <option value="esri">Esri 街道图</option>
          <option value="osm">OpenStreetMap</option>
          <option value="amap-sat">高德卫星图</option>
        </select>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
