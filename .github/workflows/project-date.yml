name: project-date

# Sets the Project "Date" (latest commit date) and "Start date" (earliest commit
# date) when a pull request is opened or updated.
#
# Requires a repository secret PROJECT_TOKEN: a classic PAT with `repo` + `project`
# scopes (the default GITHUB_TOKEN cannot access Projects v2).
# Optional repository variable PROJECT_TITLE (default: "<repo> Roadmap").

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  set-date:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
    steps:
      - name: Set project date fields
        if: ${{ env.PROJECT_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectTitle = process.env.PROJECT_TITLE || `${context.repo.repo} Roadmap`;
            const prNumber = context.payload.pull_request.number;

            const prData = await github.graphql(
              `query($owner:String!,$repo:String!,$number:Int!){
                repository(owner:$owner,name:$repo){
                  pullRequest(number:$number){
                    id
                    createdAt
                    commits(first:100){ nodes { commit { committedDate } } }
                  }
                }
              }`,
              { owner: context.repo.owner, repo: context.repo.repo, number: prNumber },
            );
            const pr = prData.repository.pullRequest;

            const dates = pr.commits.nodes
              .map((n) => n.commit.committedDate)
              .filter(Boolean)
              .sort();
            const startDate = (dates[0] || pr.createdAt).slice(0, 10);
            const endDate = (dates[dates.length - 1] || pr.createdAt).slice(0, 10);

            const projects = await github.graphql(
              `query { viewer { projectsV2(first:100) { nodes { id title } } } }`,
            );
            const project = projects.viewer.projectsV2.nodes.find((p) => p.title === projectTitle);
            if (!project) {
              core.warning(`project not found: ${projectTitle}`);
              return;
            }

            const items = await github.graphql(
              `query($p:ID!){ node(id:$p){ ... on ProjectV2 { items(first:100){ nodes { id content { ... on PullRequest { number } } } } } } }`,
              { p: project.id },
            );
            let item = items.node.items.nodes.find((i) => i.content && i.content.number === prNumber);
            if (!item) {
              const added = await github.graphql(
                `mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p,contentId:$c}){ item { id } } }`,
                { p: project.id, c: pr.id },
              );
              item = added.addProjectV2ItemById.item;
            }

            const fields = await github.graphql(
              `query($p:ID!){ node(id:$p){ ... on ProjectV2 { fields(first:50){ nodes { ... on ProjectV2FieldCommon { id name dataType } } } } } }`,
              { p: project.id },
            );
            const dateField = fields.node.fields.nodes.find((f) => f.name === 'Date');
            const startField = fields.node.fields.nodes.find((f) => f.name === 'Start date');

            const mutation = `mutation($p:ID!,$i:ID!,$f:ID!,$d:Date!){ updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{date:$d}}){ projectV2Item { id } } }`;
            if (dateField) {
              await github.graphql(mutation, { p: project.id, i: item.id, f: dateField.id, d: endDate });
            }
            if (startField) {
              await github.graphql(mutation, { p: project.id, i: item.id, f: startField.id, d: startDate });
            }
            core.info(`project dates: ${startDate} -> ${endDate}`);
